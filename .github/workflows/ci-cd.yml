name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore TranslationApp.sln

      - name: Build Solution (Release)
        run: dotnet build TranslationApp.sln -c Release --no-restore

      - name: Run Automated Tests
        run: dotnet test TranslationApp.sln -c Release --no-build --verbosity normal

  release:
    name: Publish & Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Single-File Executable
        run: |
          dotnet publish TranslationApp.UI\TranslationApp.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\publish
          if (Test-Path .\publish\TranslationApp.UI.exe) {
            Copy-Item .\publish\TranslationApp.UI.exe .\publish\TranslationApp.exe -Force
          }

      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\publish\TranslationApp.exe -Algorithm SHA256).Hash
          "$hash  TranslationApp.exe" | Out-File -FilePath .\publish\TranslationApp.exe.sha256 -Encoding utf8 -NoNewline
          Write-Output "Generated SHA256: $hash"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/TranslationApp.exe
            publish/TranslationApp.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
